name: Build Velora APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velora-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pillow

      - name: Quick checks (JS syntax + Open-With manifest test)
        run: |
          for f in public/js/*.js; do cp "$f" "/tmp/check.mjs" && node --check /tmp/check.mjs || exit 1; done
          python3 -I tests/manifest_test.py

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Turn it into Velora (intents, plugin, icons, signing)
        run: |
          python3 scripts/patch_android.py
          npx cap sync android
          echo "--- intent filters in the final manifest ---"
          grep -c "android.intent.action.VIEW" android/app/src/main/AndroidManifest.xml
          grep -q "velora-patched" android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/Velora.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Velora-APK
          path: out/Velora.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/Velora.apk \
            --title "Velora v${{ github.run_number }}" \
            --notes "Velora APK — download Velora.apk and install it on your phone." \
            --latest
